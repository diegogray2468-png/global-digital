    <script>
        const translations = {
            en: {
                subtitle: "Graphic Design & Digital Services",

                srv2: "✔️ Video Editing & Production",
                srv3: "✔️ Digital Branding & Marketing",
                postsTitle: "POSTS & MEDIA",

                post1Desc: "New graphic design and photo editing work from GLOBAL DIGITAL."
            },
            sw: {

                navAbout: "Kuhusu Sisi",
                navServices: "Huduma Zetuu",
                navPosts: "Posts & Media",
                adminTitle: "Jopo la Utawala (Admin Panel)",

                srv1: "✔️ Suluhisho za Ubunifu wa Picha (Graphic Design)",
                srv2: "✔️ Uhariri wa Video & Utengenezaji",

            },

                srv2: "✔️ Montage Vidéo & Production",
                srv3: "✔️ Image de Marque & Marketing Numérique",
                postsTitle: "PUBLICATIONS & MÉDIAS",

            }

        function changeLanguage() {
            const lang = document.getElementById("languageSelect").value;
            const t = translations[lang];

            document.getElementById("txt-subtitle").innerText = t.subtitle;
            document.getElementById("nav-about").innerText = t.navAbout;
            document.getElementById("nav-services").innerText = t.navServices;
            document.getElementById("nav-posts").innerText = t.navPosts;
            document.getElementById("admin-title").innerText = t.adminTitle;
            document.getElementById("btn-publish").innerText = t.btnPublish;
            document.getElementById("services-title").innerText = t.servicesTitle;
            document.getElementById("srv-1").innerText = t.srv1;
            document.getElementById("srv-2").innerText = t.srv2;
            document.getElementById("srv-3").innerText = t.srv3;
            document.getElementById("posts-title").innerText = t.postsTitle;
            document.getElementById("post1-title").innerText = t.post1Title;
            document.getElementById("post1-desc").innerText = t.post1Desc;
        }

        // Netlify Identity Management & Admin Panel Toggle
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (user) {
                    document.getElementById("admin-panel").style.display = "block";
                }
            });
            window.netlifyIdentity.on("login", user => {
                document.getElementById("admin-panel").style.display = "block";
                window.netlifyIdentity.close();
            });
            window.netlifyIdentity.on("logout", () => {
                document.getElementById("admin-panel").style.display = "none";

        }

function publishPost() {
    const title = document.getElementById('post-title').value;
    const desc = document.getElementById('post-desc').value;
    const fileInput = document.getElementById('post-link');

    let postsContainer = document.getElementById('posts-container');
    if (!postsContainer) {
        postsContainer = document.createElement('div');
        postsContainer.id = 'posts-container';
        document.getElementById('admin-panel').after(postsContainer);
    }

    if (title === '' && desc === '' && fileInput.files.length === 0) {
        alert('Tafadhali jaza kichwa, maelezo, au chagua picha/video!');
        return;
    }

    let postCard = document.createElement('div');
    postCard.style.cssText = "background: #fff; padding: 15px; margin-top: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);";
    
    let htmlContent = '<h3 style="margin: 0 0 10px 0; color: #333;">' + title + '</h3>';
    htmlContent += '<p style="margin: 0 0 10px 0; color: #555;">' + desc + '</p>';

    if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const fileUrl = URL.createObjectURL(file);
        if (file.type.startsWith('video/')) {
            htmlContent += '<video controls src="' + fileUrl + '" style="max-width:100%; border-radius:8px; margin-top:10px;"></video>';
        } else {
            htmlContent += '<img src="' + fileUrl + '" alt="Post Image" style="max-width:100%; border-radius:8px; margin-top:10px;">';
        }
    }

    postCard.innerHTML = htmlContent;
    postsContainer.prepend(postCard);

    document.getElementById('post-title').value = '';
    document.getElementById('post-desc').value = '';
    fileInput.value = '';
}
script>
document.addEventListener("DOMContentLoaded", function() {
    const publishBtn = document.getElementById('btn-publish');
    if (publishBtn) {
        publishBtn.addEventListener('click', function() {
            const title = document.getElementById('post-title').value;
            const desc = document.getElementById('post-desc').value;
            const fileInput = document.getElementById('post-file');
            
            if (!title && !desc && fileInput.files.length === 0) {
                alert("Veuillez remplir au moins un champ ou choisir un fichier !");
                return;
            }

            const container = document.getElementById('posts-container');
            const newPost = document.createElement('div');
            newPost.style.marginBottom = '20px';
            newPost.style.padding = '15px';
            newPost.style.border = '1px solid #ddd';
            newPost.style.borderRadius = '8px';
            newPost.style.background = '#fff';

            let contentHtml = '<h3 style="margin-bottom: 5px;">' + title + '</h3><p style="margin-bottom: 10px;">' + desc + '</p>';

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const fileUrl = URL.createObjectURL(file);
                
                if (file.type.startsWith('image/')) {
                    contentHtml += '<img src="' + fileUrl + '" style="width:100%; max-height:400px; object-fit:cover; border-radius:5px;">';
                } else if (file.type.startsWith('video/')) {
                    contentHtml += '<video width="100%" controls style="border-radius:5px;"><source src="' + fileUrl + '" type="' + file.type + '"></video>';
                } else {
                    contentHtml += '<div style="padding: 12px; background: #f1f1f1; border-radius: 5px; margin-top: 10px;"><a href="' + fileUrl + '" target="_blank" style="color: #0056b3; font-weight: bold; text-decoration: none;">📁 Fichier joint: ' + file.name + '</a></div>';
                }
            }

            newPost.innerHTML = contentHtml;
            container.prepend(newPost);

            document.getElementById('post-title').value = '';
            document.getElementById('post-desc').value = '';
            fileInput.value = '';

            alert("Post publié avec succès !");
        });
    }
});
</script>
